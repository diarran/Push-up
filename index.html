<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Coach Pompes IA</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pompes IA" />

<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    background: #0a0a0a;
  }

  /* ---------- Ecran d'accueil ---------- */
  #homeScreen {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: max(28px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
    text-align: center;
    background: radial-gradient(circle at 50% 0%, #161616 0%, #0a0a0a 65%);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #homeScreen h1 {
    color: #fff;
    font-size: 1.5rem;
    margin: 4px 0 0 0;
  }
  #homeScreen .subtitle {
    color: #777;
    font-size: 0.8rem;
    margin: 0;
  }

  .statsRow {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 380px;
  }
  .statTile {
    flex: 1;
    background: #161616;
    border: 1px solid #232323;
    border-radius: 16px;
    padding: 14px 6px;
  }
  .statTile .statValue {
    color: #00e676;
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1.1;
  }
  .statTile .statLabel {
    color: #888;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  #startBtn {
    background: #00e676;
    color: #001a0a;
    border: none;
    padding: 18px 40px;
    border-radius: 999px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0, 230, 118, 0.3);
    width: 100%;
    max-width: 320px;
  }
  #startBtn:active { transform: scale(0.97); }
  #startBtn:disabled { opacity: 0.6; }

  #homeScreen .tip {
    color: #666;
    font-size: 0.8rem;
    max-width: 320px;
    line-height: 1.4;
    margin: 0;
  }

  #errorBox {
    color: #ff5252;
    font-size: 0.85rem;
    max-width: 320px;
    display: none;
  }

  .historySection {
    width: 100%;
    max-width: 380px;
    text-align: left;
    margin-top: 4px;
  }
  .historySection h2 {
    color: #999;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin: 0 0 10px 2px;
  }
  #historyList {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .historyItem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #141414;
    border: 1px solid #212121;
    border-radius: 12px;
    padding: 10px 14px;
  }
  .historyItem .hDate {
    color: #ccc;
    font-size: 0.85rem;
    text-transform: capitalize;
  }
  .historyItem .hMeta {
    color: #666;
    font-size: 0.7rem;
    margin-top: 2px;
  }
  .historyItem .hReps {
    color: #00e676;
    font-weight: 800;
    font-size: 1.1rem;
  }
  .emptyHistory {
    color: #555;
    font-size: 0.82rem;
    padding: 10px 2px;
  }

  #toast {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0, 230, 118, 0.92);
    color: #001a0a;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 12px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 30;
    white-space: nowrap;
  }
  #toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- Vue caméra ---------- */
  #videoWrap {
    position: absolute;
    inset: 0;
    display: none;
    background: #000;
  }
  video { display: none; }
  canvas#output {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* effet miroir naturel caméra frontale */
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)) 14px;
  }

  #topBar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  #counterBox {
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 10px 22px;
    text-align: center;
    pointer-events: auto;
  }
  #counter {
    font-size: 3.2rem;
    font-weight: 800;
    color: #fff;
    line-height: 1;
  }
  #counterLabel {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #aaa;
  }

  #topRight {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    pointer-events: auto;
  }

  #endBtn {
    background: rgba(211, 47, 47, 0.85);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  #debugToggle {
    background: rgba(20, 20, 20, 0.55);
    color: #888;
    border: none;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 0.65rem;
  }

  #debugBox {
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 0.7rem;
    color: #ccc;
    line-height: 1.5;
    min-width: 118px;
    text-align: right;
    display: none;
  }
  #debugBox.visible { display: block; }

  #messageBanner {
    align-self: center;
    padding: 14px 26px;
    border-radius: 16px;
    font-size: 1.15rem;
    font-weight: 700;
    text-align: center;
    color: #fff;
    background: rgba(60, 60, 60, 0.55);
    backdrop-filter: blur(8px);
    transition: background 0.15s ease, transform 0.15s ease;
    max-width: 90%;
  }
  #messageBanner.error { background: rgba(211, 47, 47, 0.85); }
  #messageBanner.success { background: rgba(0, 200, 83, 0.88); transform: scale(1.05); }
  #messageBanner.neutral { background: rgba(60, 60, 60, 0.55); }
  #messageBanner.warn { background: rgba(255, 152, 0, 0.85); }

  #stagePill {
    align-self: center;
    margin-top: 10px;
    font-size: 0.75rem;
    color: #ccc;
    background: rgba(20,20,20,0.5);
    padding: 4px 12px;
    border-radius: 999px;
  }
</style>
</head>
<body>
<div id="app">

  <div id="homeScreen">
    <h1>💪 Coach Pompes IA</h1>
    <p class="subtitle">Vision par ordinateur en temps réel</p>

    <div class="statsRow">
      <div class="statTile">
        <div class="statValue" id="statToday">0</div>
        <div class="statLabel">Aujourd'hui</div>
      </div>
      <div class="statTile">
        <div class="statValue" id="statTotal">0</div>
        <div class="statLabel">Total</div>
      </div>
      <div class="statTile">
        <div class="statValue" id="statStreak">0</div>
        <div class="statLabel">Jours de suite</div>
      </div>
    </div>

    <button id="startBtn">Démarrer la séance</button>
    <p class="tip">Place ton iPhone contre un mur ou en appui, recule-toi pour que ton buste et tes jambes soient visibles de profil.</p>
    <div id="errorBox"></div>

    <div class="historySection">
      <h2>Historique</h2>
      <div id="historyList"></div>
    </div>
  </div>

  <div id="videoWrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="output"></canvas>
  </div>

  <div id="hud" style="display:none;">
    <div id="topBar">
      <div id="counterBox">
        <div id="counter">0</div>
        <div id="counterLabel">Pompes</div>
      </div>
      <div id="topRight">
        <button id="endBtn">Terminer</button>
        <button id="debugToggle">Debug</button>
        <div id="debugBox"></div>
      </div>
    </div>

    <div>
      <div id="messageBanner" class="neutral">Positionne-toi dans le cadre</div>
      <div id="stagePill">Phase: HAUT</div>
    </div>
  </div>

  <div id="toast"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script>
(() => {
  "use strict";

  // ============ CONFIGURATION (à ajuster pendant les tests) ============
  const CFG = {
    DOWN_ANGLE: 90,     // coude plié à <= 90° => bas atteint
    UP_ANGLE: 160,      // coude tendu à >= 160° => haut atteint
    ALIGN_ANGLE: 160,   // angle épaule-hanche-cheville mini pour considérer le dos droit
    VIS_THRESHOLD: 0.55,
    MODEL_COMPLEXITY: 1 // 0 = plus rapide/moins précis, 1 = équilibré, 2 = précis/lourd
  };

  const LM = {
    L_SHOULDER: 11, R_SHOULDER: 12,
    L_ELBOW: 13, R_ELBOW: 14,
    L_WRIST: 15, R_WRIST: 16,
    L_HIP: 23, R_HIP: 24,
    L_ANKLE: 27, R_ANKLE: 28
  };

  // ============ HISTORIQUE (localStorage) ============
  const HISTORY_KEY = "pushupCoach.history.v1";

  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(history) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    } catch (e) {
      console.warn("Impossible de sauvegarder l'historique", e);
    }
  }

  function dateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function addSession(reps, durationSec) {
    if (reps <= 0) return loadHistory();
    const history = loadHistory();
    history.push({
      date: dateKey(new Date()),
      timestamp: new Date().toISOString(),
      reps,
      durationSec: Math.round(durationSec)
    });
    saveHistory(history);
    return history;
  }

  function computeStats(history) {
    const today = dateKey(new Date());
    let todayReps = 0;
    let totalReps = 0;
    const daysWithSessions = new Set();

    for (const s of history) {
      totalReps += s.reps;
      daysWithSessions.add(s.date);
      if (s.date === today) todayReps += s.reps;
    }

    let streak = 0;
    const cursor = new Date();
    while (daysWithSessions.has(dateKey(cursor))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }

    return { todayReps, totalReps, totalSessions: history.length, streak };
  }

  function fmtDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function fmtDate(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }

  function renderHome() {
    const history = loadHistory();
    const stats = computeStats(history);

    statToday.textContent = stats.todayReps;
    statTotal.textContent = stats.totalReps;
    statStreak.textContent = stats.streak;

    if (history.length === 0) {
      historyList.innerHTML = '<div class="emptyHistory">Aucune séance enregistrée pour l\'instant.</div>';
      return;
    }

    const recent = history.slice().reverse().slice(0, 10);
    historyList.innerHTML = recent
      .map(
        (s) => `
        <div class="historyItem">
          <div>
            <div class="hDate">${fmtDate(s.date)}</div>
            <div class="hMeta">${fmtDuration(s.durationSec)} min</div>
          </div>
          <div class="hReps">${s.reps}</div>
        </div>`
      )
      .join("");
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("visible");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("visible"), 2600);
  }

  // ============ ELEMENTS ============
  const homeScreen = document.getElementById("homeScreen");
  const startBtn = document.getElementById("startBtn");
  const errorBox = document.getElementById("errorBox");
  const videoWrap = document.getElementById("videoWrap");
  const videoEl = document.getElementById("video");
  const canvasEl = document.getElementById("output");
  const ctx = canvasEl.getContext("2d");
  const hud = document.getElementById("hud");
  const counterEl = document.getElementById("counter");
  const messageBanner = document.getElementById("messageBanner");
  const stagePill = document.getElementById("stagePill");
  const debugBox = document.getElementById("debugBox");
  const debugToggle = document.getElementById("debugToggle");
  const endBtn = document.getElementById("endBtn");
  const toastEl = document.getElementById("toast");
  const statToday = document.getElementById("statToday");
  const statTotal = document.getElementById("statTotal");
  const statStreak = document.getElementById("statStreak");
  const historyList = document.getElementById("historyList");

  debugToggle.addEventListener("click", () => {
    debugBox.classList.toggle("visible");
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }

  // ============ ETAT DU COACH IA ============
  let repCount = 0;
  let stage = "up"; // "up" | "down"
  let formBrokenThisRep = false;
  let sessionActive = false;
  let sessionStartedAt = 0;

  function setMessage(text, type) {
    messageBanner.textContent = text;
    messageBanner.className = type;
  }

  function setStagePill() {
    stagePill.textContent = "Phase: " + (stage === "up" ? "HAUT" : "BAS");
  }

  function resetSessionState() {
    repCount = 0;
    counterEl.textContent = "0";
    stage = "up";
    formBrokenThisRep = false;
    canvasReady = false;
    setMessage("Positionne-toi dans le cadre", "neutral");
    setStagePill();
  }

  // ============ GEOMETRIE ============
  function angleAt(a, b, c) {
    // angle au sommet b, formé par b->a et b->c, en degrés
    const rad = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let deg = Math.abs((rad * 180) / Math.PI);
    if (deg > 180) deg = 360 - deg;
    return deg;
  }

  function visOk(...pts) {
    return pts.every((p) => p && (p.visibility === undefined || p.visibility >= CFG.VIS_THRESHOLD));
  }

  function pickSide(lms) {
    const leftPts = [lms[LM.L_SHOULDER], lms[LM.L_ELBOW], lms[LM.L_WRIST], lms[LM.L_HIP], lms[LM.L_ANKLE]];
    const rightPts = [lms[LM.R_SHOULDER], lms[LM.R_ELBOW], lms[LM.R_WRIST], lms[LM.R_HIP], lms[LM.R_ANKLE]];
    const sum = (pts) => pts.reduce((s, p) => s + (p && p.visibility !== undefined ? p.visibility : 0), 0);
    return sum(leftPts) >= sum(rightPts)
      ? { shoulder: lms[LM.L_SHOULDER], elbow: lms[LM.L_ELBOW], wrist: lms[LM.L_WRIST], hip: lms[LM.L_HIP], ankle: lms[LM.L_ANKLE] }
      : { shoulder: lms[LM.R_SHOULDER], elbow: lms[LM.R_ELBOW], wrist: lms[LM.R_WRIST], hip: lms[LM.R_HIP], ankle: lms[LM.R_ANKLE] };
  }

  // ============ LOGIQUE COACH (machine à états) ============
  function evaluateRep(elbowAngle, alignOk) {
    if (stage === "down" && !alignOk) formBrokenThisRep = true;

    if (stage === "up") {
      if (elbowAngle <= CFG.DOWN_ANGLE) {
        stage = "down";
        formBrokenThisRep = !alignOk;
        setMessage(alignOk ? "Bas ! Remonte" : "🔴 Gaine ton bassin", alignOk ? "neutral" : "error");
      } else if (elbowAngle < CFG.UP_ANGLE) {
        setMessage("🔴 Descends plus bas", "error");
      } else {
        setMessage("Prêt", "neutral");
      }
    } else {
      // stage === "down"
      if (!alignOk) {
        setMessage("🔴 Gaine ton bassin", "error");
      } else if (elbowAngle <= CFG.DOWN_ANGLE) {
        setMessage("Bas ! Remonte", "neutral");
      } else if (elbowAngle < CFG.UP_ANGLE) {
        setMessage("🔴 Tends les bras", "error");
      } else {
        // verrouillage haut atteint -> fin de répétition
        stage = "up";
        if (!formBrokenThisRep) {
          repCount++;
          counterEl.textContent = repCount;
          setMessage("🟢 Super !", "success");
        } else {
          setMessage("🔴 Gaine ton bassin", "error");
        }
        formBrokenThisRep = false;
      }
    }
    setStagePill();
  }

  // ============ MEDIAPIPE POSE ============
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: CFG.MODEL_COMPLEXITY,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  let canvasReady = false;

  function ensureCanvasSize() {
    if (canvasReady) return;
    if (videoEl.videoWidth && videoEl.videoHeight) {
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      canvasReady = true;
    }
  }

  pose.onResults((results) => {
    if (!sessionActive) return;
    ensureCanvasSize();
    if (!canvasReady) return;

    ctx.save();
    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

    const lms = results.poseLandmarks;

    if (!lms) {
      setMessage("Positionne-toi dans le cadre", "neutral");
      ctx.restore();
      return;
    }

    window.drawConnectors(ctx, lms, window.POSE_CONNECTIONS, { color: "#00e676", lineWidth: 3 });
    window.drawLandmarks(ctx, lms, { color: "#ffffff", lineWidth: 1, radius: 3 });

    const side = pickSide(lms);

    if (!visOk(side.shoulder, side.elbow, side.wrist, side.hip, side.ankle)) {
      setMessage("Recule-toi, corps entier visible", "neutral");
      ctx.restore();
      return;
    }

    const elbowAngle = angleAt(side.shoulder, side.elbow, side.wrist);
    const alignAngle = angleAt(side.shoulder, side.hip, side.ankle);
    const alignOk = alignAngle >= CFG.ALIGN_ANGLE;

    debugBox.innerHTML =
      "Coude: " + elbowAngle.toFixed(0) + "°<br>" +
      "Bassin: " + alignAngle.toFixed(0) + "°";

    evaluateRep(elbowAngle, alignOk);

    ctx.restore();
  });

  // ============ CAMERA (iOS Safari : démarrage sur geste utilisateur) ============
  let camera = null;

  async function startSession() {
    startBtn.disabled = true;
    errorBox.style.display = "none";

    try {
      if (typeof Camera === "undefined") {
        throw new Error("La librairie caméra MediaPipe n'a pas pu être chargée (vérifie ta connexion).");
      }

      resetSessionState();

      videoWrap.style.display = "block";
      hud.style.display = "flex";
      homeScreen.style.display = "none";

      camera = new Camera(videoEl, {
        onFrame: async () => {
          if (!sessionActive || document.hidden) return;
          await pose.send({ image: videoEl });
        },
        facingMode: "user",
        width: 720,
        height: 1280
      });

      await camera.start();
      sessionActive = true;
      sessionStartedAt = Date.now();
    } catch (err) {
      homeScreen.style.display = "flex";
      videoWrap.style.display = "none";
      hud.style.display = "none";
      startBtn.disabled = false;
      console.error(err);
      if (err && err.name === "NotAllowedError") {
        showError("Accès caméra refusé. Autorise la caméra dans Réglages > Safari > Caméra, puis réessaie.");
      } else {
        showError("Erreur caméra : " + (err && err.message ? err.message : err));
      }
    }
  }

  function stopCameraStream() {
    try {
      if (camera && typeof camera.stop === "function") camera.stop();
    } catch (e) {
      console.warn(e);
    }
    const stream = videoEl.srcObject;
    if (stream && stream.getTracks) {
      stream.getTracks().forEach((t) => t.stop());
    }
    videoEl.srcObject = null;
    camera = null;
    canvasReady = false;
  }

  function endSession() {
    if (!sessionActive) return;
    sessionActive = false;

    const durationSec = (Date.now() - sessionStartedAt) / 1000;
    const finishedReps = repCount;
    stopCameraStream();

    videoWrap.style.display = "none";
    hud.style.display = "none";
    debugBox.classList.remove("visible");
    homeScreen.style.display = "flex";
    startBtn.disabled = false;

    addSession(finishedReps, durationSec);
    renderHome();

    if (finishedReps > 0) {
      showToast(`Séance enregistrée : ${finishedReps} pompe${finishedReps > 1 ? "s" : ""} 💪`);
    }
  }

  startBtn.addEventListener("click", startSession);
  endBtn.addEventListener("click", endSession);

  // ============ PWA : service worker (app shell hors-ligne) ============
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed", e));
    });
  }

  // ============ INIT ============
  renderHome();
})();
</script>
</body>
</html>
